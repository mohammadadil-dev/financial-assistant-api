spring.application.name=chatbotapp

# Identity injected into the LLM system prompt (prompts/system-prompt.md)
app.bot.name=XYZ Assistant
app.company.name=XYZ Finance

# LLM function-calling on the free-text path. Requires a tool-capable model:
# Groq llama-3.3 ✓ | Ollama needs llama3.1+ (base llama3 does NOT support tools)
app.ai.tools.enabled=true

# RAG: minimum similarity score for retrieved chunks (0..1)
app.rag.similarity-threshold=0.45

# Company credit-policy caps (SAR) per product & nationality — tune freely
app.policy.cap.personal.saudi=50000
app.policy.cap.personal.nonsaudi=20000
app.policy.cap.auto.saudi=200000
app.policy.cap.auto.nonsaudi=100000
app.policy.cap.home.saudi=2000000
app.policy.cap.home.nonsaudi=1000000
#spring.ai.openai.api-key:${OPEN_AI_KEY}
#spring.ai.openai.embedding.model:text-embedding-3-small
#spring.chat.options.model: 
spring.ai.vectorstore.pinecone.apiKey=${PINECONE_API}
spring.ai.vectorstore.pinecone.indexName=finance-assistant
spring.ai.vectorstore.pinecone.hostName=finance-assistant-zdr1ecd.svc.aped-4627-b74a.pinecone.io
app.ai.provider=Ollama
# ollama configuration
#https://thermolabile-cosmological-ace.ngrok-free.dev
spring.ai.ollama.base-url= http://localhost:11434
spring.ai.ollama.init.timeout=5m
spring.ai.ollama.init.max-retries=0
spring.ai.ollama.chat.options.model=llama3
# mxbai-embed-large (1024-dim) matches the existing Pinecone index dimension; do not
# switch to nomic-embed-text (768-dim) without also recreating the Pinecone index.
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# Groq
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.3
spring.chat.options.temperature: 0.3
logging.level.org.springframework.ai: DEBUG
logging.level.org.springframework.web.reactive.function.client: DEBUG
logging.level.org.springframework.web.client: DEBUG
logging.level.org.springframework.ai.ollama: DEBUG
logging.level.org.springframework.boot.context.properties: DEBUG